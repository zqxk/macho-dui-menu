<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Macho DUI Menu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: transparent;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .macho-container {
            display: none; 
            width: 650px;
            height: 420px;
            background: rgba(12, 12, 18, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #fff;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .macho-header {
            height: 60px;
            background: linear-gradient(135deg, #e63946 0%, #a8201a 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .macho-body {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .macho-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 18px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .macho-button:hover {
            background: rgba(230, 57, 70, 0.3);
            border-color: rgba(230, 57, 70, 0.6);
        }
    </style>
</head>
<body>

    <div class="macho-container" id="menu-container">
        <div class="macho-header">
            <span id="title">MACHO MENU</span>
            <span style="font-size: 12px; opacity: 0.6;">v1.0</span>
        </div>
        <div class="macho-body" id="content">
            <div class="macho-button">Self Options</div>
            <div class="macho-button">Vehicle Options</div>
            <div class="macho-button">Server Settings</div>
        </div>
    </div>

    <script>
        const container = document.getElementById('menu-container');

        // Listen for messages from Lua
        window.addEventListener('message', function(event) {
            let item = event.data;
            
            if (typeof item === 'string') {
                try { item = JSON.parse(item); } catch (e) {}
            }

            if (item && item.action === "toggleMenu") {
                if (item.data && item.data.open) {
                    container.style.display = 'flex';
                } else {
                    container.style.display = 'none';
                }
            }

            if (item && item.type === "UPDATE_TITLE") {
                document.getElementById('title').innerText = item.title;
            }
        });

        // Close menu on Escape key press
        document.addEventListener('keyup', function(event) {
            if (event.key === 'Escape') {
                container.style.display = 'none';
                
                // Notify Lua to disable focus/input
                fetch(`https://${GetParentResourceName()}/closeMenu`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                }).catch(() => {});
            }
        });
    </script>
</body>
</html>
